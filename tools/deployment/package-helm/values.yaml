global:
  fullnameOverride: ""
  nameOverride: ""

# Whether to allow scripts in `sbin` access to services on the host.
allowHostAccessForSbinScripts: true

# Each image accepts `tag`, `digest`, or both. When both are set, the digest selects the image and
# the tag is only a human-readable label.
#
# Presto and the CLP connector are deployed by the `clp-presto` subchart; their images are set under
# `clp-presto.image` below.
image:
  clpPackage:
    repository: "ghcr.io/y-scope/clp/clp-package"
    pullPolicy: "Always"
    tag: "main"
  mariadb:
    repository: "mariadb"
    pullPolicy: "Always"
    tag: "10.11.16"
  mysql:
    repository: "mysql"
    pullPolicy: "Always"
    tag: "8.0.46"
  curl:
    repository: "curlimages/curl"
    pullPolicy: "IfNotPresent"
    tag: "8.14.1"
  kubectl:
    repository: "bitnami/kubectl"
    pullPolicy: "IfNotPresent"
    digest: "sha256:98736aabcecb8d3cbcdcd7b132d14b1d67ed99bac2f06d471f06235933103df3"  # v1.36.0
  otelCollector:
    repository: >-
      ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    pullPolicy: "IfNotPresent"
    tag: "0.152.0"
  queue:
    repository: "rabbitmq"
    pullPolicy: "Always"
    tag: "4.2.6"
  redis:
    repository: "redis"
    pullPolicy: "Always"
    tag: "7.4.8"
  resultsCache:
    repository: "mongo"
    pullPolicy: "Always"
    tag: "9.0.4"

# Values for the `clp-presto` subchart, which deploys Presto with the CLP connector.
# The values marked below are rendered with `tpl` by the subchart, so they can reference this
# release. Images, resources, and scheduling for Presto live here.
clp-presto:
  enabled: false
  fullnameOverride: '{{ include "clp.fullname" . }}-presto'
  serviceAccountName: '{{ include "clp.fullname" . }}-service-account'
  # The CLP chart renders the catalog Secret, so credentials stay out of a ConfigMap.
  catalogs:
    existingSecret: '{{ include "clp.fullname" . }}-presto-catalog'
  # Must match `clpConfig.archive_output.storage`; Helm cannot derive subchart values from the
  # parent's config.
  archiveStorage:
    type: "fs"
    fs:
      existingClaim: '{{ include "clp.fullname" . }}-shared-data-archives'
      mountPath: "/var/data/archives"
  coordinator:
    # The parent supplies the catalog Secret, whose content the subchart cannot hash into the pod
    # template, so roll the pod on every upgrade.
    rollOnUpgrade: true
    # Like this chart's own components, Presto tolerates control-plane taints so that it can be
    # scheduled on a single-node cluster's only node. Setting `tolerations` replaces this list.
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
    # Wait for the CLP metadata tables before the coordinator starts. The subchart pulls its own
    # kubectl image (`clp-presto.image.kubectl`), which is separate from this chart's.
    extraInitContainers:
      - name: "wait-for-db-table-creator"
        image: '{{ include "clp-presto.imageRef" (dict "root" . "component" "kubectl") }}'
        command: ["kubectl", "wait", "--for=condition=complete",
                  'job/{{ include "clp.fullname" . }}-db-table-creator', "--timeout=300s"]
  worker:
    rollOnUpgrade: true
    # See `coordinator.tolerations`.
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
  # Metadata columns the coordinator prunes splits on, keyed by scope. This default prunes on the
  # archive time ranges that every clp-s dataset records. See
  # https://github.com/y-scope/clp-plugin-presto-connector/blob/main/presto-connector/README.md
  splitMetadataConfig:
    # The empty scope applies to every table.
    "":
      metaColumns:
        begin_timestamp:
          type: "bigint"
          asRangeBoundOf: "timestamp"
          boundType: "LOWER"
        end_timestamp:
          type: "bigint"
          asRangeBoundOf: "timestamp"
          boundType: "UPPER"
      requiredColumns: []

# - If false: Single-node deployment.
#   - Pods automatically tolerate control-plane taints.
#   - Each worker deployment supports only 1 replica.
# - If true: Multi-node deployment.
#   - When using filesystem storage (`archive_output.storage.type: "fs"`), the PVC-backed
#     directories must be accessible from all worker nodes (e.g., via NFS/CephFS mounted at
#     the same path).
distributedDeployment: false

# Per-component node scheduling and replica config.
# Each component accepts: replicas (workers only), nodeSelector, affinity, tolerations,
# topologySpreadConstraints.
#
# Example:
#   scheduling:
#     compressionWorker:
#       replicas: 3
#       nodeSelector:
#         yscope.io/nodeType: "compression"
#       tolerations:
#         - key: "yscope.io/dedicated"
#           operator: "Equal"
#           value: "compression"
#           effect: "NoSchedule"
#       topologySpreadConstraints:
#         - maxSkew: 1
#           topologyKey: "kubernetes.io/hostname"
#           whenUnsatisfiable: "DoNotSchedule"
scheduling:
  # Worker
  compressionWorker:
    replicas: 1
    slotsPerPod: 8
  queryWorker:
    replicas: 1
    slotsPerPod: 8
  reducer:
    replicas: 1
    slotsPerPod: 8

  # Database
  database: {}
  queue: {}
  redis: {}
  resultsCache: {}

  # Core
  compressionCoordinator: {}
  compressionScheduler: {}
  logIngestor: {}
  queryCoordinator: {}
  queryScheduler: {}
  garbageCollector: {}
  apiServer: {}
  webui: {}
  mcpServer: {}
  otelCollector: {}

# Per-component resource requests and limits.
# Each component accepts: requests (cpu, memory, ephemeral-storage) and limits
# (cpu, memory, ephemeral-storage).
# Values follow Kubernetes resource format (e.g., cpu: "1", memory: "1Gi",
# ephemeral-storage: "4Gi").
# When omitted, no resource requests or limits are configured.
resources:
  # Worker
  compressionWorker: {}
  queryWorker: {}
  reducer: {}

  # Database
  database: {}
  queue: {}
  redis: {}
  resultsCache: {}

  # Core
  compressionCoordinator: {}
  compressionScheduler: {}
  logIngestor: {}
  queryCoordinator: {}
  queryScheduler: {}
  garbageCollector: {}
  apiServer: {}
  webui: {}
  mcpServer: {}
  otelCollector: {}

  # Jobs
  dbTableCreator: {}
  resultsCacheIndicesCreator: {}
  topologyMetricsEmitter: {}

clpConfig:
  # List of third-party services bundled (deployed) as part of the chart.
  # Remove a service from this list to use an external instance instead, and configure its host/port
  # accordingly in the service-specific sections below.
  bundled: [
    "database",
    "queue",
    "redis",
    "results_cache",
    "otel_collector",
  ]

  package:
    storage_engine: "clp-s"

  # API server config
  api_server:
    serviceType: "ClusterIP"  # "NodePort", "ClusterIP", or "LoadBalancer"
    port: 30301  # Specifies the service's nodePort. Ignored unless serviceType is "NodePort".
    query_job_polling:
      initial_backoff_ms: 100
      max_backoff_ms: 5000
    stream_file_extraction_timeout_secs: 270

  # Location (e.g., directory) containing any logs you wish to compress. Must be reachable by all
  # workers.
  logs_input:
    type: "fs"

    # NOTE: This directory will be exposed inside the container, so symbolic links to files outside
    # this directory will be ignored.
    directory: "/"

  database:
    type: "mariadb"  # "mariadb" or "mysql"
    # Host and port for the database service. When "database" is in `bundled`, the host is
    # automatically set to the bundled service name (ignored). When external, set these to the
    # external service's address.
    host: "localhost"
    port: 30306
    names:
      clp: "clp-db"

  compression_coordinator:
    commit_task_hard_timeout_secs: 60
    commit_task_max_retry: 1
    commit_task_soft_timeout_secs: 45
    compression_task_max_retry: 1
    database_connection_pool_size: 10
    job_polling_interval_millisecs: 100
    logging_level: "INFO"
    max_concurrent_jobs: 1000
    result_polling:
      init_backoff_millisecs: 100
      max_backoff_millisecs: 1000
    termination_timeout_secs: 30

  compression_scheduler:
    jobs_poll_delay: 0.1  # seconds
    logging_level: "INFO"
    max_concurrent_tasks_per_job: 0  # A value of 0 disables the limit
    telemetry_update_interval_ms: 60000

  query_coordinator:
    database_connection_pool_size: 10
    job_polling_interval_millisecs: 100
    logging_level: "INFO"
    max_concurrent_jobs: 1000
    max_datasets_per_query: 10  # Set to null to disable the limit
    query_task_max_retry: 1
    result_polling_interval_millisecs: 100
    termination_timeout_secs: 30

  query_scheduler:
    jobs_poll_delay: 0.1  # seconds
    max_datasets_per_query: 10  # Set to null to disable the limit
    num_archives_to_search_per_sub_job: 16
    logging_level: "INFO"
    scheduler_concurrency: 4
    telemetry_update_interval_ms: 60000

  queue:
    # Host and port for the queue service. When "queue" is in `bundled`, the host is automatically
    # set to the bundled service name (ignored). When external, set these to the external service's
    # address.
    host: "localhost"
    port: 5672

  redis:
    # Host and port for the Redis service. When "redis" is in `bundled`, the host is automatically
    # set to the bundled service name (ignored). When external, set these to the external service's
    # address.
    host: "localhost"
    port: 6379
    query_backend_database: 0
    compression_backend_database: 1

  results_cache:
    # Host and port for the results cache service. When "results_cache" is in `bundled`, the host is
    # automatically set to the bundled service name (ignored). When external, set these to the
    # external service's address.
    host: "localhost"
    port: 30017
    db_name: "clp-query-results"
    stream_collection_name: "stream-files"

    # Retention period for search results, in minutes. Set to null to disable automatic deletion.
    retention_period: 60

  otel_collector:
    # Host and port for the OpenTelemetry Collector service. When "otel_collector" is in `bundled`,
    # the host is automatically set to the bundled service name (ignored). When external, set these
    # to the external service's address.
    host: "localhost"
    port: 4318

  compression_worker:
    logging_level: "INFO"
    task_soft_time_limit: 600
    task_time_limit: 1200
    telemetry_update_interval_ms: 60000

  query_worker:
    logging_level: "INFO"
    task_soft_time_limit: 600
    task_time_limit: 1200
    telemetry_update_interval_ms: 60000
    query_trace_sampling_probability: 0.01

  reducer:
    logging_level: "INFO"
    upsert_interval: 100  # milliseconds

  webui:
    serviceType: "ClusterIP"  # "NodePort", "ClusterIP", or "LoadBalancer"
    query_engine: "clp-s"
    port: 30000  # Specifies the service's nodePort. Ignored unless serviceType is "NodePort".
    presto_max_num_search_results: 1000
    rate_limit: 1000
    results_metadata_collection_name: "results-metadata"

  mcp_server: null
  #   serviceType: "ClusterIP"  # "NodePort", "ClusterIP", or "LoadBalancer"
  #   port: 30800  # Specifies the service's nodePort. Ignored unless serviceType is "NodePort".
  #   logging_level: "INFO"

  # Presto query engine config for the Web UI/API server. Set `clp-presto.enabled` to deploy Presto
  # with the `clp-presto` subchart; to use an external Presto instance instead, set `host` and
  # `port`. Presto's images, resources, scheduling, and split metadata config live under
  # `clp-presto` above.
  #
  # Workers read archives on S3 using the archive output's `aws_authentication`, whose type must be
  # "credentials" or "default". With "default", workers get credentials from the AWS default
  # credential provider chain, e.g., an IAM role for the service account through
  # `serviceAccount.annotations`.
  presto: null
  #   host: "localhost"
  #   port: 30889

  # log-ingestor config. Currently, the config is applicable only if `logs_input.type` is "s3".
  log_ingestor:
    serviceType: "ClusterIP"  # "NodePort", "ClusterIP", or "LoadBalancer"
    port: 30302  # Specifies the service's nodePort. Ignored unless serviceType is "NodePort".
    logging_level: "INFO"

  # Where archives should be output to
  archive_output:
    storage:
      type: "fs"

    # Retention period for archives, in minutes. Set to null to disable automatic deletion.
    retention_period: null

    # How much data CLP should try to compress into each archive
    target_archive_size: 268435456  # 256 MB

    # How large the dictionaries should be allowed to get before the archive is
    # closed and a new one is created
    target_dictionaries_size: 33554432  # 32 MB

    # How large each encoded file should be before being split into a new encoded
    # file
    target_encoded_file_size: 268435456  # 256 MB

    # How much data CLP should try to fit into each segment within an archive
    target_segment_size: 268435456  # 256 MB

    # How much archives should be compressed: 1 (fast/low compression) to 19 (slow/high compression)
    compression_level: 3

  # Where CLP stream files (e.g., IR streams) should be output
  stream_output:
    storage:
      type: "fs"

    # How large each stream file should be before being split into a new stream file
    target_uncompressed_size: 134217728  # 128 MB

  garbage_collector:
    logging_level: "INFO"

    # Interval (in minutes) at which garbage collector jobs run
    sweep_interval:
      archive: 60
      search_result: 30

  # AWS config content (e.g., `~/.aws/config`). Provide file contents via `--set-file` to create a
  # chart-managed Secret that is mounted into pods. Set to null to disable.
  # Usage:
  #   helm install <release> <chart> \
  #     --set-file clpConfig.aws_config.credentials=$HOME/.aws/credentials \
  #     --set-file clpConfig.aws_config.config=$HOME/.aws/config
  aws_config: null

  # Telemetry config
  telemetry:
    disable: false
    endpoint: "https://telemetry.yscope.io"

credentials:
  database:
    username: "clp-user"
    password: "pass"
    root_username: "root"
    root_password: "root-pass"

  queue:
    username: "clp-user"
    password: "pass"

  redis:
    password: "pass"

  spiderResourceGroups:
    compression: "compression-pass"
    query: "query-pass"

serviceAccount:
  annotations:
  # For IRSA on EKS, set:
  #   eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/<role-name>"

# Overrides for the Spider subchart's `values.yaml`
spider:
  enabled: false
  image:
    # Temporary pin: upcoming Spider `main` changes may break, and its next release is a while away.
    scheduler:
      tag: "sha-278d06f"
    storage:
      tag: "sha-278d06f"
    worker:
      repository: "ghcr.io/y-scope/clp/clp-spider-worker"
      tag: "main"
  spiderConfig:
    # List of third-party services bundled (deployed) as part of the Spider subchart.
    # Remove a service from this list to use an external instance instead, and configure its
    # connection details accordingly in the service-specific sections below.
    bundled: [
      "database",
    ]

    # Connection config for the Spider database service; defaults to the Spider subchart's
    # `values.yaml`. When "database" is in `bundled`, the host is automatically set to the bundled
    # service name (ignored). When external, set these to the external service's address and
    # credentials.
    # database:
    #   host: "localhost"
    #   port: 3306
    #   name: "spider-db"
    #   username: "spider-user"
    #   password: "spider-password"

    worker:
      extra_envs:
        - name: "CLP_CONFIG_PATH"
          value: "/etc/clp-config.yaml"
        - name: "CLP_DB_USER"
          valueFrom:
            secretKeyRef:
              name: "{{ include \"clp.fullname\" . }}-database"
              key: "username"
        - name: "CLP_DB_PASS"
          valueFrom:
            secretKeyRef:
              name: "{{ include \"clp.fullname\" . }}-database"
              key: "password"
      extra_volume_mounts:
        - name: "clp-config"
          mountPath: "/etc/clp-config.yaml"
          subPath: "clp-config.yaml"
          readOnly: true
        - name: "staged-archives"
          mountPath: "/var/data/staged-archives"
      extra_volumes:
        - name: "clp-config"
          configMap:
            name: "{{ include \"clp.fullname\" . }}-config"
        - name: "staged-archives"
          emptyDir: {}
      service_account_name: "{{ include \"clp.fullname\" . }}-service-account"
      pools:
        - name: "general"
          replicas: 2
          resource_group: null
        - name: "compression"
          replicas: 2
          resource_group:
            external_id: "compression"
            password:
              secretKeyRef:
                name: "{{ include \"clp.fullname\" . }}-spider-resource-groups"
                key: "compression"
        - name: "query"
          replicas: 4
          resource_group:
            external_id: "query"
            password:
              secretKeyRef:
                name: "{{ include \"clp.fullname\" . }}-spider-resource-groups"
                key: "query"
