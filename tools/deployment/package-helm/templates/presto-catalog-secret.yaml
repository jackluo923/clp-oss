{{- if index .Values "clp-presto" "enabled" }}
{{- /* Helm cannot derive the subchart's values from the parent's, so catch a mismatch here rather
       than letting Presto mount the wrong archive storage. */}}
{{- $presto := index .Values "clp-presto" }}
{{- with .Values.clpConfig.archive_output.storage }}
{{- $expected := .type | default "fs" }}
{{- $actual := $presto.archiveStorage.type | default "fs" }}
{{- if ne $expected $actual }}
{{- fail (printf "clp-presto.archiveStorage.type is %q but clpConfig.archive_output.storage.type is %q; they must match." $actual $expected) }}
{{- end }}
{{- end }}
apiVersion: "v1"
kind: "Secret"
metadata:
  name: {{ include "clp.fullname" . }}-presto-catalog
  labels:
    {{- include "clp.labels" . | nindent 4 }}
    app.kubernetes.io/component: "presto"
type: "Opaque"
stringData:
  # The `clp-presto` subchart mounts these keys through `catalogs.existingSecret`.
  coordinator-catalog-clp.properties: |
    {{- include "clp.prestoCoordinatorCatalog" . | nindent 4 }}
  worker-catalog-clp.properties: |
    {{- include "clp.prestoWorkerCatalog" . | nindent 4 }}
{{- end }}
